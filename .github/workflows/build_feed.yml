name: Build RSS Feed

on:
  push:
    branches: [main]
    paths:
      - "feed_items.json"
      - "generate_feed.py"
  schedule:
    # Runs daily; tweets in twitter_posts.json flow into the feed too
    - cron: "17 4 * * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate feed.xml
        run: python generate_feed.py --write

      - name: Commit updated feed.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update RSS feed [skip ci]" && git push)
name: Build site feeds

on:
  push:
    branches: [main]
    paths:
      - "feed_items.json"
      - "generate_feed.py"
      - "twitter_posts.json"
      - "sync_tweets.py"
      - "build_sitemap.py"
      - "*.html"
  schedule:
    # Weekly is plenty for this cadence — the push trigger above already
    # rebuilds on every real edit, so the cron is just a safety net.
    # (Daily + timestamp churn used to redeploy Pages every day for nothing.)
    - cron: "17 4 * * 1"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate feed.xml + sitemap.xml
        run: |
          python generate_feed.py --write
          python build_sitemap.py --write

      - name: Link check (internal links + anchors)
        run: python check_links.py

      - name: Commit updated feed.xml + sitemap.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update RSS feed + sitemap [skip ci]" && git push)
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        document.documentElement.setAttribute("data-theme", localStorage.getItem("retroTheme") || "win95");
        if (sessionStorage.getItem("bootSeen") === "true") {
          document.documentElement.classList.add("skip-boot");
        }
      })();
    </script>
    <title>My Tweets | rokurooooo</title>
    <meta
      name="description"
      content="Twitter/X post feed."
    />
    <meta property="og:title" content="My Tweets | rokuro's website'" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rokurooooo01.github.io/twitter.html" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/main.js"></script>
  </head>
  <body onload="initLoadingScreen()">
    <!-- Desktop Stickers -->
    <div class="sticker sticker-tl"><img src="images/sticker1.gif" alt="" aria-hidden="true" class="button-88x31"></div>
    <div class="sticker sticker-tr"><img src="images/sticker2.gif" alt="" aria-hidden="true" class="button-88x31"></div>
    <div class="sticker sticker-bl"><img src="images/sticker3.gif" alt="" aria-hidden="true" class="button-88x31"></div>
    <div class="sticker sticker-br"><img src="images/sticker4.gif" alt="" aria-hidden="true" class="button-88x31"></div>

    <div id="loading-screen">
      <div class="loading-box">
        <p>System Booting...</p>
        <div class="loading-bar-container">
          <div id="loading-bar-fill" class="loading-bar-fill"></div>
        </div>
      </div>
    </div>

    <nav class="page-nav" aria-label="Site pages">
      <a class="button" href="index.html">Home</a>
      <a class="button" href="about.html">About</a>
      <a class="button" href="mathematics.html">Math</a>
      <a class="button" href="favorites.html">Favorites</a>
      <a class="button" href="mood-gallery.html">Gallery</a>
      <a class="button" href="today.html">Today</a>
      <a class="button" href="twitter.html">Twitter</a>
    </nav>
    <main class="container page-shell">
      <header class="site-header">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem;">
            <p class="eyebrow">social feed</p>
            <h1>My Tweets</h1>
          </div>
          <div id="site-clock" aria-live="polite"></div>
        </div>
      </header>

      <div class="window-frame">
        <div class="window-titlebar">
          <div class="window-titlebar-label">Twitter / X Feed</div>
          <div class="window-titlebar-controls">
            <div class="window-btn">_</div>
            <div class="window-btn">□</div>
            <div class="window-btn">×</div>
          </div>
        </div>
        <section class="content hero-card" style="border: none; box-shadow: none; margin: 0;">
          <p class="eyebrow">latest updates</p>
          <p>
            Recent posts from my Twitter/X account <a href="https://x.com/rokurooooo07" target="_blank" rel="noopener">@rokurooooo07</a>.
          </p>
        </section>
      </div>

      <section class="content card" aria-label="Tweet stream" style="margin-top: 1rem;">
        <div id="tweets-container">
          <p>Loading tweets...</p>
        </div>
      </section>
    </main>

    <script>
      async function loadTweets() {
        const container = document.getElementById('tweets-container');
        try {
          const response = await fetch('twitter_posts.json');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const tweets = await response.json();
          
          if (!tweets || tweets.length === 0) {
            container.innerHTML = `
              <div class="status-widget" style="padding: 1rem;">
                <p>No tweets listed yet.</p>
                <p style="margin-top: 1rem;">
                  <a href="https://x.com/rokurooooo07" target="_blank" rel="noopener" class="button" style="display: inline-flex; align-items: center; gap: 0.5rem;">
                    <img src="images/twitter-88x31.gif" alt="Twitter" class="button-88x31" style="margin: 0;">
                    Visit @rokurooooo07 on X
                  </a>
                </p>
              </div>
            `;
            return;
          }

          container.innerHTML = tweets.map(tweet => {
            const dateStr = new Date(tweet.created_at).toLocaleDateString('en-US', {
              year: 'numeric',
              month: 'short',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            });
            return `
              <div class="card" style="margin-bottom: 1rem; background: var(--panel, #c0c0c0); border: 2px solid; border-color: var(--border-light, #fff) var(--border-darkest, #000) var(--border-darkest, #000) var(--border-light, #fff); padding: 1rem; box-shadow: var(--shadow, 2px 2px 0px #000);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; border-bottom: 2px solid var(--border-dark, #808080); padding-bottom: 0.4rem;">
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <img src="images/twitter-88x31.gif" alt="X" class="button-88x31" style="width: 44px; height: 16px; border: none; box-shadow: none;">
                    <a href="https://x.com/rokurooooo07" target="_blank" rel="noopener" style="font-weight: bold; color: var(--accent, #000080);">@rokurooooo07</a>
                  </div>
                  <small style="opacity: 0.8; font-family: 'Courier New', monospace; font-size: 0.8rem;">${dateStr}</small>
                </div>
                <div style="background: var(--paper, #c0c0c0); border: 1px solid var(--border-dark, #808080); padding: 0.8rem; box-shadow: inset 1px 1px 0 #000;">
                  <p style="white-space: pre-wrap; font-size: 0.95rem; margin: 0; color: var(--ink, #000);">${tweet.text}</p>
                </div>
              </div>
            `;
          }).join('') + `
            <div style="text-align: center; margin-top: 1.5rem;">
              <a href="https://x.com/rokurooooo07" target="_blank" rel="noopener" class="button" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.8rem;">
                <img src="images/twitter-88x31.gif" alt="Twitter" class="button-88x31" style="margin: 0;">
                Follow @rokurooooo07 on X
              </a>
            </div>
          `;
        } catch (error) {
          container.innerHTML = `
            <div class="status-widget" style="padding: 1rem; text-align: center;">
              <h3 style="margin-bottom: 0.5rem;">Latest Twitter / X Updates</h3>
              <p style="margin-bottom: 1rem;">View posts directly on X:</p>
              <a href="https://x.com/rokurooooo07" target="_blank" rel="noopener" class="button" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.8rem;">
                <img src="images/twitter-88x31.gif" alt="Twitter" class="button-88x31" style="margin: 0;">
                Follow @rokurooooo07 on X
              </a>
            </div>
          `;
        }
      }

      document.addEventListener('DOMContentLoaded', loadTweets);
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
